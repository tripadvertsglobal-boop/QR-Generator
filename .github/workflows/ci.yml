name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Throwaway build-time values. The build never reaches Supabase (every
          # route is dynamic), so these only need to parse — no real project is
          # referenced, and CI never builds with VERCEL_ENV=production, so the
          # lib/env.ts production gate does not apply here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_REDIRECT_DOMAIN: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          LINK_UNLOCK_SECRET: ci-placeholder-unlock-secret
